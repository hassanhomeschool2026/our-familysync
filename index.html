<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var k = 'fs-theme';
        try {
          var t = localStorage.getItem(k);
          var d = document.documentElement;
          var dark =
            t === 'dark' ||
            ((t === 'system' || !t) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) d.classList.add('dark');
          else d.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/FSLogoIconOnly-512.png" />
    <link rel="apple-touch-icon" href="/FSLogo_Tealhorizon-512.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/FSLogo_Tealhorizon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <title>Our FamilySync</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
